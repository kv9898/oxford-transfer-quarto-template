title: Oxford Transfer of Status
author: Dianyi Yang (Quarto adaptation), based on work by Joseph Rowell and Frank Fu
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    pdf:
      documentclass: report
      classoption:
        - 12pt
      papersize: a4
      pdf-engine: lualatex
      date-format: "MMMM YYYY"
      toc: true
      toc-depth: 3
      lof: true
      lot: true
      lol: false
      number-sections: true
      linestretch: 1.5
      running-header: true
      minimal-footer: false
      geometry:
        - top=25mm
        - bottom=25mm
        - left=30mm
        - right=30mm
        - includeheadfoot
        - headheight=15pt
      colorlinks: true
      linkcolor: black
      citecolor: blue
      urlcolor: blue
      link-citations: true
      include-in-header: header.tex
      template-partials:
        - before-body.tex
        - toc.tex
